<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1120;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050810;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#bgGrad)" />

  <!-- Outer border glow -->
  <rect width="100" height="100" rx="20" ry="20" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Left code bracket < -->
  <text x="8" y="66" font-family="monospace" font-size="52" font-weight="bold" fill="url(#cyanGrad)" filter="url(#glow)" opacity="0.7">{</text>

  <!-- Letter D -->
  <text x="28" y="68" font-family="Arial Black, sans-serif" font-size="46" font-weight="900" fill="url(#cyanGrad)" filter="url(#glow)">D</text>

  <!-- Right code bracket > -->
  <text x="72" y="66" font-family="monospace" font-size="52" font-weight="bold" fill="url(#cyanGrad)" filter="url(#glow)" opacity="0.7">}</text>

  <!-- Dot underline accent -->
  <rect x="35" y="76" width="30" height="3" rx="2" fill="url(#cyanGrad)" opacity="0.8" />
</svg>
